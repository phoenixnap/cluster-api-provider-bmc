name: ci

on:
  pull_request:
  push:
    branches:
    - main

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: check generated files are up to date
        run: |
          go run sigs.k8s.io/controller-tools/cmd/controller-gen@v0.17.3 rbac:roleName=manager-role crd webhook paths="./..." output:crd:artifacts:config=config/crd/bases
          go run sigs.k8s.io/controller-tools/cmd/controller-gen@v0.17.3 object:headerFile="hack/boilerplate.go.txt" paths="./..."
          git diff --exit-code
      - name: govulncheck
        run: make vulncheck
